<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>XOX</title>
<style>
:root {
  --bg: #0f1226;
  --panel: #181c3a;
  --panel-2: #20254a;
  --text: #eef0ff;
  --muted: #8b90b8;
  --x: #ff5c8a;
  --o: #4dd4ff;
  --win: #ffd166;
  --ok: #3ddc97;
  --off: #ff6b6b;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  color: var(--text);
  font-family: system-ui, "Segoe UI", Roboto, sans-serif;
  background:
    radial-gradient(circle at 20% 10%, #2a2f66 0%, transparent 45%),
    radial-gradient(circle at 80% 90%, #4a1f55 0%, transparent 40%),
    var(--bg);
}

.card {
  width: 100%;
  max-width: 420px;
  padding: 24px;
  text-align: center;
  background: var(--panel);
  border-radius: 24px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
}

h1 {
  margin: 0 0 16px;
  font-size: 34px;
  letter-spacing: 6px;
  background: linear-gradient(90deg, var(--x), var(--o));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.muted { color: var(--muted); }
section > p { margin: 10px 0; }

input {
  width: 100%;
  padding: 12px 14px;
  font-size: 16px;
  color: var(--text);
  background: var(--panel-2);
  border: 2px solid transparent;
  border-radius: 12px;
  outline: none;
}
input:focus { border-color: var(--o); }
#code { text-transform: uppercase; letter-spacing: 2px; text-align: center; }

.btn {
  padding: 12px 18px;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  background: var(--panel-2);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.1s, filter 0.15s;
}
.btn:hover:not(:disabled) { filter: brightness(1.2); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: linear-gradient(135deg, var(--x), #a855f7); }
.btn.small { padding: 6px 12px; font-size: 13px; }

#nameBox .btn, #createBtn { width: 100%; margin-top: 12px; }
.row { display: flex; gap: 8px; }
.or { margin: 16px 0; color: var(--muted); font-size: 14px; }

.roombar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 16px;
}
.roombar b { letter-spacing: 3px; font-size: 18px; }

.players {
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 14px;
}
.pcard {
  flex: 1;
  padding: 10px 8px;
  background: var(--panel-2);
  border-radius: 14px;
  border: 2px solid transparent;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.pcard.active {
  border-color: var(--win);
  box-shadow: 0 0 16px rgba(255, 209, 102, 0.35);
}
.pname {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 14px;
  overflow: hidden;
  white-space: nowrap;
}
.pname span:last-child { overflow: hidden; text-overflow: ellipsis; }
.pmark { font-size: 22px; font-weight: 800; }
.pmark.x { color: var(--x); }
.pmark.o { color: var(--o); }
.pscore { font-size: 26px; font-weight: 700; }
.vs { display: flex; flex-direction: column; justify-content: center; font-size: 12px; min-width: 50px; }
.vs div:last-child { font-size: 20px; font-weight: 700; color: var(--text); }

.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--ok); }
.dot.off { background: var(--off); }

.status { min-height: 24px; margin: 8px 0 14px; font-size: 17px; }

#board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 0 auto 18px;
}
.cell {
  aspect-ratio: 1;
  font-size: clamp(40px, 14vw, 64px);
  font-weight: 800;
  background: var(--panel-2);
  border: none;
  border-radius: 16px;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.cell:disabled { cursor: default; }
.cell:not(:disabled):hover { background: #2b3160; transform: translateY(-2px); }
.cell.x { color: var(--x); }
.cell.o { color: var(--o); }
.cell.pop { animation: pop 0.25s ease-out; }
.cell.win {
  background: rgba(255, 209, 102, 0.18);
  box-shadow: inset 0 0 0 3px var(--win);
}
@keyframes pop {
  0% { transform: scale(0.3); opacity: 0; }
  70% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}

.actions { display: flex; gap: 10px; justify-content: center; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main class="card">
  <h1>XOX</h1>

  <section id="nameBox" hidden>
    <p class="muted">Oyuncu adını seç</p>
    <input id="nameInput" maxlength="16" placeholder="Adın" autocomplete="off">
    <button id="nameBtn" class="btn primary">Devam</button>
  </section>

  <section id="lobby" hidden>
    <p class="muted">Merhaba, <b id="hello"></b></p>
    <button id="createBtn" class="btn primary">Yeni oda aç</button>
    <div class="or">veya oda koduyla katıl</div>
    <div class="row">
      <input id="code" maxlength="8" placeholder="ODA KODU" autocomplete="off">
      <button id="joinBtn" class="btn">Katıl</button>
    </div>
    <p id="lobbyMsg" class="muted"></p>
  </section>

  <section id="game" hidden>
    <div class="roombar">
      <span class="muted">Oda</span>
      <b id="roomcode"></b>
      <button id="copyBtn" class="btn small">Linki kopyala</button>
    </div>

    <div class="players">
      <div class="pcard" id="meCard">
        <div class="pname"><span class="dot on"></span><span id="meName"></span></div>
        <div class="pmark" id="meMark"></div>
        <div class="pscore" id="meScore">0</div>
      </div>
      <div class="vs">
        <div class="muted">berabere</div>
        <div id="drawScore">0</div>
      </div>
      <div class="pcard" id="oppCard">
        <div class="pname"><span class="dot" id="oppDot"></span><span id="oppName">Rakip</span></div>
        <div class="pmark" id="oppMark"></div>
        <div class="pscore" id="oppScore">0</div>
      </div>
    </div>

    <p id="status" class="status">Bağlanıyor...</p>
    <div id="board"></div>

    <div class="actions">
      <button id="resetBtn" class="btn primary" disabled>Yeni tur</button>
      <button id="lobbyBtn" class="btn">Lobiye dön</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
function show(id) { $(id).hidden = false; }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
function makeToken() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}
function cleanCode(s) { return (s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8); }

const WIN_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function winLine(board) {
  for (const [a, b, c] of WIN_LINES) {
    if (board[a] && board[a] === board[b] && board[b] === board[c]) return [a, b, c];
  }
  return [];
}

const room = cleanCode(new URLSearchParams(location.search).get("room"));
const name = lsGet("xox_name") || "";

// ---- Ad ekranı ----
function saveName() {
  const v = $("nameInput").value.trim();
  if (!v) return;
  lsSet("xox_name", v.slice(0, 16));
  location.reload();
}
$("nameBtn").onclick = saveName;
$("nameInput").onkeydown = e => { if (e.key === "Enter") saveName(); };

// ---- Hangi ekran açılacak? ----
if (!name) {
  show("nameBox");
} else if (!room) {
  show("lobby");
  $("hello").textContent = name;
  $("createBtn").onclick = () => {
    const code = (Math.random().toString(36) + "0000").slice(2, 6).toUpperCase();
    location.href = "/?room=" + code;
  };
  const join = () => {
    const c = cleanCode($("code").value);
    if (c.length < 4) { $("lobbyMsg").textContent = "Oda kodu en az 4 karakter olmalı."; return; }
    location.href = "/?room=" + c;
  };
  $("joinBtn").onclick = join;
  $("code").onkeydown = e => { if (e.key === "Enter") join(); };
} else {
  startGame();
}

// ---- Oyun ----
function startGame() {
  show("game");
  $("roomcode").textContent = room;
  $("meName").textContent = name;
  $("lobbyBtn").onclick = () => { location.href = "/"; };
  $("copyBtn").onclick = async () => {
    const btn = $("copyBtn");
    try { await navigator.clipboard.writeText(location.href); btn.textContent = "Kopyalandı ✓"; }
    catch (e) { btn.textContent = "Kopyalanamadı"; }
    setTimeout(() => { btn.textContent = "Linki kopyala"; }, 1500);
  };

  let token = ssGet("xox_token_" + room);
  if (!token) { token = makeToken(); ssSet("xox_token_" + room, token); }

  const boardEl = $("board");
  const statusEl = $("status");
  const resetBtn = $("resetBtn");
  let ws = null, me = null, tries = 0, stopped = false;
  let prev = Array(9).fill("");

  function send(obj) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
  }

  const cells = [];
  for (let i = 0; i < 9; i++) {
    const b = document.createElement("button");
    b.className = "cell";
    b.disabled = true;
    b.onclick = () => send({type: "move", cell: i});
    boardEl.appendChild(b);
    cells.push(b);
  }
  resetBtn.onclick = () => send({type: "reset"});

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(
      `${proto}://${location.host}/ws/${room}?name=${encodeURIComponent(name)}&token=${encodeURIComponent(token)}`
    );
    ws.onopen = () => { tries = 0; };
    ws.onmessage = e => {
      const d = JSON.parse(e.data);
      if (d.type === "you") me = d.mark;
      else if (d.type === "full") { stopped = true; statusEl.textContent = "Bu oda dolu, zaten iki oyuncu var."; }
      else if (d.type === "error") { stopped = true; statusEl.textContent = d.msg; }
      else if (d.type === "state") render(d);
    };
    ws.onclose = () => {
      if (stopped) return;
      if (tries >= 10) { statusEl.textContent = "Bağlanılamadı. Sayfayı yenile."; return; }
      tries++;
      statusEl.textContent = "Bağlantı koptu, yeniden bağlanılıyor...";
      setTimeout(connect, 2000);
    };
  }

  function render(d) {
    if (!me) return;
    const oppMark = me === "X" ? "O" : "X";
    const opp = d.players[oppMark];
    const bothHere = !!(opp && opp.online);
    const line = (d.winner && d.winner !== "draw") ? winLine(d.board) : [];
    const myTurn = !d.winner && bothHere && d.turn === me;

    // Tahta
    cells.forEach((el, i) => {
      const v = d.board[i];
      el.textContent = v;
      let cls = "cell";
      if (v) cls += " " + v.toLowerCase();
      if (v && prev[i] !== v) cls += " pop";
      if (line.includes(i)) cls += " win";
      el.className = cls;
      el.disabled = !(myTurn && !v);
    });
    prev = d.board.slice();

    // Oyuncu kartları
    $("meMark").textContent = me;
    $("meMark").className = "pmark " + me.toLowerCase();
    $("meScore").textContent = d.scores[me];
    $("oppMark").textContent = oppMark;
    $("oppMark").className = "pmark " + oppMark.toLowerCase();
    $("oppScore").textContent = d.scores[oppMark];
    $("oppName").textContent = opp ? opp.name : "Rakip bekleniyor";
    $("oppDot").className = "dot" + (opp ? (opp.online ? " on" : " off") : "");
    $("drawScore").textContent = d.scores.draw;

    const live = bothHere && !d.winner;
    $("meCard").classList.toggle("active", live && d.turn === me);
    $("oppCard").classList.toggle("active", live && d.turn === oppMark);

    // Durum yazısı
    if (!opp) statusEl.textContent = "Rakip bekleniyor... Linki arkadaşına gönder.";
    else if (!opp.online) statusEl.textContent = `${opp.name} koptu, geri dönmesi bekleniyor...`;
    else if (d.winner === "draw") statusEl.textContent = "Berabere!";
    else if (d.winner) statusEl.textContent = d.winner === me ? "Kazandın! 🎉" : `${opp.name} kazandı.`;
    else statusEl.textContent = d.turn === me ? "Sıra sende!" : `${opp.name} oynuyor...`;

    resetBtn.disabled = !(d.winner && bothHere);
  }

  setInterval(() => send({type: "ping"}), 20000);
  connect();
}
</script>
</body>
</html>
